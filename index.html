<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors-Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h1>Welcome to the Rock Paper Scissors game!</h1>
        <p>Please choose: </p>

        <div class="choices">
            <button class="choicebtn">Rock</button>
            <button class="choicebtn">Paper</button>
            <button class="choicebtn">Scissors</button>
        </div>

        <div class="battleTable">
            <div id="playerCard" class="battleCard hidden">
                <p class="cardTitle">Player</p>
                <div id="playerIcon" class="cardIcon">❔</div>
                <p id="playerPick">Waiting...</p>
            </div>

            <div class="vsText">VS</div>

            <div id="computerCard" class="battleCard hidden">
                <p class="cardTitle">Computer</p>
                <div id="computerIcon" class="cardIcon">❔</div>
                <p id="computerPick">Waiting...</p>
            </div>
        </div>
        
        <div id="resultScreen"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
